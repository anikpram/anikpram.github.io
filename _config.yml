lang: en
title: "Aniket Pramanik"
url: "https://anikpram.github.io"   # <-- use your actual GitHub username here
baseurl: ""

#remote_theme: alshedivat/al-folio@v0.14.6
remote_theme: jekyll/minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-remote-theme
  #- jekyll-scholar
  - jekyll-toc

collections:
  posts:
    output: true
    permalink: /blog/:title/

paginate: 0
paginate_path: "/blog/page:num/"
permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge


