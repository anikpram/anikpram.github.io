name: Build and Deploy (al-folio)

on:
  push:
    branches: ["alfolio"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug – branch & HEAD
        run: |
          echo "BRANCH: $(git rev-parse --abbrev-ref HEAD)"
          echo "SHA: $(git rev-parse --short HEAD)"

      - name: Debug – find any main.scss and show first lines
        run: |
          echo "== searching for main.scss =="
          find . -type f -iname "main.scss" -print -exec sed -n '1,20p' {} \; || true
          echo "== grep for '$max-content-width:' =="
          grep -R --line-number --color=never '\$max-content-width:' . || echo "no matches"


      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Configure Pages first (sets up env vars like base path)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          bundle install
          JEKYLL_ENV=production bundle exec jekyll build --trace

      # Debug: list the built site
      - name: List build output
        run: |
          echo "== PWD =="
          pwd
          echo "== ls -la =="
          ls -la
          echo "== ls -la _site =="
          ls -la _site || (echo "_site missing!" && exit 1)

      # Upload _site as the artifact for Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
