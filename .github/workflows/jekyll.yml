name: Build and Deploy (al-folio)

on:
  push:
    branches: ["alfolio"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: |
          bundle install
          JEKYLL_ENV=production bundle exec jekyll build --trace

      # Required by Pages (sets base path, etc.)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the built _site as the artifact for Pages to deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
